<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

      content="A reproducible study of collaborative knowledge-corruption attacks on retrieval-augmented generation, and the defenses that fight back."

      // Set theme before paint to avoid a flash. Defaults to light.
      (function () {
        try {
          var t = localStorage.getItem("crd-theme");

          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
